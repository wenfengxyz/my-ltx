// @name         LTX 破解资源库 · 一键下载
// @namespace    ltx-115
// @version      2.2
// @description  让 Jasna-LTX 资源库页面的「添加到下载」按钮直接提交任务到 115 云下载、aria2 或 qBittorrent，设置在页面的「下载设置」里
// @match        https://ltx.libray.workers.dev/*
// @run-at       document-end
// @grant        GM_xmlhttpRequest
// @grant        GM_getValue
// @grant        GM_setValue
// @connect      115.com
// @connect      localhost
// @connect      127.0.0.1
// @connect      *
// ==/UserScript==

(function () {
  'use strict';

  // 115 网页版云下载用的接口，靠 115.com 的登录 Cookie 鉴权
  const API = 'https://clouddownload.115.com/web/';
  const TIMEOUT = 20000;

  // 只在 Jasna-LTX 资源库页面上生效
  if (!document.querySelector('meta[name="ltx-app"]')) return;
  // 值是协议版本：1 只支持 115，2 起支持 aria2 和 qBittorrent，3 起只连用户允许过的地址、不把对方的原始响应交给页面
  document.documentElement.dataset.ltx115 = '3';

  /** 发请求，网络错误和超时都走 reject；netMsg 是连不上时给用户看的话 */
  const http = (opts, netMsg) => new Promise((resolve, reject) => GM_xmlhttpRequest({
    timeout: TIMEOUT,
    ...opts,
    onload: r => resolve({ status: r.status, text: r.responseText ?? '' }),
    onerror: () => reject(new Error(netMsg)),
    ontimeout: () => reject(new Error('请求超时')),
  }));

  // ---------- 安全 ----------
  // 页面上的任何脚本都能给这个脚本发事件，而这个脚本发的请求不受跨域限制、会带上对方网站的 Cookie。
  // 万一页面被注入了恶意脚本，不能让它借这里去读别的网站、往你的 115 里塞任务。所以：
  //   - 只转发 ed2k / 磁力链接
  //   - aria2 / qBittorrent 只连本机；别的地址（局域网 NAS、远程服务器）第一次用时弹窗问你，允许过的记在脚本自己的存储里，页面改不了
  //   - 地址不能带 ? 和 #（防止把固定的接口路径挤进查询参数，变成访问任意网址）
  //   - 测试连接只回传版本号，不把对方的原始响应交给页面

  const LINK = /^(ed2k:\\/\\/\\||magnet:\\?)/i;
  function checkLinks(urls) {
    if (!Array.isArray(urls) || !urls.length || urls.length > 500 || !urls.every(u => typeof u === 'string' && LINK.test(u))) {
      throw new Error('只能提交 ed2k / 磁力链接');
    }
    return urls;
  }

  const isLoopback = host => host === 'localhost' || host === '[::1]' || /^127\\.\\d+\\.\\d+\\.\\d+$/.test(host);
  const ALLOWED = 'allowedHosts';
  /** 本机直接放行；别的主机要你亲自点过「允许」（弹窗由脚本自己弹，页面上的脚本点不了） */
  function allowHost(u, name) {
    if (isLoopback(u.hostname)) return;
    const allowed = GM_getValue(ALLOWED, []);
    if (allowed.includes(u.host)) return;
    const ok = window.confirm(\`「下载设置」要把任务发到 \${u.host}（\${name}）。\\n\\n只有这是你自己的 \${name} 时才点「确定」；不认识这个地址就点「取消」。\`);
    if (!ok) throw new Error(\`没有允许连接 \${u.host}\`);
    GM_setValue(ALLOWED, [...allowed, u.host]);
  }

  /** 页面传来的 aria2 / qBittorrent 地址：只接受 http(s)、不带账号、? 和 #，主机要允许过 */
  function checkUrl(url, name) {
    const raw = String(url ?? '').trim();
    let u;
    try { u = new URL(raw); } catch { throw new Error(\`\${name} 地址不对，要以 http:// 开头\`); }
    if (!/^https?:$/.test(u.protocol)) throw new Error(\`\${name} 地址不对，要以 http:// 开头\`);
    if (u.username || u.password || /[?#]/.test(raw)) throw new Error(\`\${name} 地址里不能带账号、? 或 #\`);
    allowHost(u, name);
    return (u.origin + u.pathname).replace(/\\/+$/, '');
  }

  /** 版本号：只认像版本号的短字符串，其余一律不回传 */
  const safeVersion = v => {
    const s = String(v ?? '').trim();
    return /^v?\\d[\\w.+-]{0,30}$/.test(s) ? s : '';
  };
  /** 对方返回的错误说明：截短，只给提示用 */
  const short = s => String(s ?? '').replace(/\\s+/g, ' ').slice(0, 80);

  // ---------- 115 ----------

  const errMsg = j => {
    const code = j.errcode ?? j.errno ?? j.code;
    const msg = j.error_msg || j.error || j.msg || \`错误码 \${code}\`;
    // 911：没登录 115，或 115 要求先在网页里验证账号/验证码
    return code === 911 ? \`\${msg}（请先在这个浏览器登录 115.com；已登录的话到 115 网页的云下载里手动添加一次完成验证）\` : msg;
  };

  async function add115(urls, target) {
    const form = new URLSearchParams({ ac: 'add_task_urls' });
    urls.forEach((u, i) => form.set(\`url[\${i}]\`, u));
    if (target?.dir) form.set('wp_path_id', target.dir);
    const r = await http({
      method: 'POST',
      url: API,
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      data: form.toString(),
    }, '网络错误，请检查能否打开 115.com');
    // stop：没登录 115 / 要先验证账号，后面的也不会成功，页面批量添加时到这里就停
    let j;
    try { j = JSON.parse(r.text); }

    const results = Array.isArray(j.result) ? j.result : [];
    const failed = results.filter(x => !x.state);
    const ok = results.length - failed.length;
    if (!results.length || !failed.length) return { ok: true, msg: \`\${urls.length} 个链接\` };

    const r = await http({
      method: 'POST',
      url,
      headers: { 'Content-Type': 'application/json' },
      data: JSON.stringify({ jsonrpc: '2.0', id: 'ltx', method, params: [...token, ...params] }),
    }, '连不上 aria2，检查 RPC 地址、aria2 是否在运行、是否开启了 --enable-rpc');
    let j;
    try { j = JSON.parse(r.text); } catch { throw new Error(\`aria2 返回 HTTP \${r.status}，检查 RPC 地址\`); }
    if (j.error) throw new Error(j.error.message === 'Unauthorized' ? 'aria2 密钥不对' : \`aria2 报错：\${short(j.error.message)}\`);

    const options = target.dir ? { dir: target.dir } : {};

    for (const u of urls) {

      catch (e) { error = e.message; }
    }
    if (ok === urls.length) return { ok: true, msg: \`\${ok} 个链接\` };

  }

  const qbitHeaders = base => ({ Referer: \`\${base}/\`, Origin: base });
  const qbitNet = '连不上 qBittorrent，检查 Web UI 地址、qBittorrent 是否在运行、设置里是否打开了 Web UI';

  async function qbitLogin(target, base) {
    const r = await http({
      method: 'POST',
      url: \`\${base}/api/v2/auth/login\`,
      headers: { ...qbitHeaders(base), 'Content-Type': 'application/x-www-form-urlencoded' },
      data: new URLSearchParams({ username: target.username ?? '', password: target.password ?? '' }).toString(),
    }, qbitNet);
    if (r.status === 403) throw new Error('qBittorrent 登录失败次数太多，IP 被暂时封禁');
    if (r.status !== 200 || r.text.trim() === 'Fails.') throw new Error('qBittorrent 用户名或密码不对');
  }

  async function qbit(target, opts) {
    const base = checkUrl(target.url, 'qBittorrent Web UI');
    const send = () => http({ ...opts, url: base + opts.path, headers: { ...qbitHeaders(base), ...opts.headers } }, qbitNet);
    const r = await send();
    if (r.status !== 403) return r;
    await qbitLogin(target, base);
    return send();
  }

  async function addQbit(urls, target) {
    const boundary = \`----ltx\${Date.now()}\`;
    const fields = { urls: urls.join('\\n'), savepath: target.dir, category: target.category };
    const data = Object.entries(fields).filter(([, v]) => v)
      .map(([k, v]) => \`--\${boundary}\\r\\nContent-Disposition: form-data; name="\${k}"\\r\\n\\r\\n\${v}\\r\\n\`).join('') + \`--\${boundary}--\\r\\n\`;
    const r = await qbit(target, {
      method: 'POST',
      path: '/api/v2/torrents/add',
      headers: { 'Content-Type': \`multipart/form-data; boundary=\${boundary}\` },
      data,
    });
    if (r.status === 200 && r.text.trim() !== 'Fails.') return { ok: true, msg: \`\${urls.length} 个链接\` };
    return { ok: false, msg: \`qBittorrent 添加失败（HTTP \${r.status}）\` };
  }

  // ---------- 和页面通信 ----------

  const ADD = { 115: add115, aria2: addAria2, qbit: addQbit };

  async function test(target) {
    if (target.type === 'aria2') return { ok: true, msg: \`aria2 \${safeVersion((await aria2(target, 'aria2.getVersion'))?.version) || '已连接'}\` };

      return { ok: false, msg: \`qBittorrent 返回 HTTP \${r.status}\` };
    }

  }

  function on(event, handle) {

  }

    const add = Object.hasOwn(ADD, target?.type ?? 115) ? ADD[target?.type ?? 115] : null;

  });
  on('ltx115:test', ({ target }) => test(target ?? {}));
})();

<script>
(function () {
  var T = { 'zh-CN': ['资源库', '正在读取作品列表…'], 'zh-TW': ['資源庫', '正在讀取作品列表…'],
    en: ['Library', 'Loading the library…'], ja: ['ライブラリ', '作品リストを読み込み中…'] }
  var l = null
  try { l = localStorage.getItem('ltx.lang') } catch (e) {}
  if (!T[l]) {
    l = 'en'
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
    for (var i = 0; i < langs.length; i++) {
      var s = String(langs[i]).toLowerCase()
      if (s.indexOf('zh') === 0) { l = /hant|-tw|-hk|-mo/.test(s) ? 'zh-TW' : 'zh-CN'; break }
      if (s.indexOf('ja') === 0) { l = 'ja'; break }
      if (s.indexOf('en') === 0) { l = 'en'; break }
    }
  }
  document.documentElement.lang = l
  document.title = 'Jasna-LTX ' + T[l][0]
  var name = document.querySelector('.sk-name'), note = document.querySelector('.sk-note')
  if (name) name.textContent = T[l][0]
  if (note) note.textContent = T[l][1]
})()
</script>

#xd-tip{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(17,24,39,.95);color:#fff;padding:10px 18px;border-radius:10px;font:13px system-ui;z-index:100000;display:none;max-width:80vw;text-align:center}
.xd-badge{position:absolute;top:6px;left:6px;background:#16a34a;color:#fff;font:11px/1 system-ui;padding:3px 6px;border-radius:5px;z-index:5;letter-spacing:.5px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
body.xd-only-sub .card:not([data-xd-sub]){display:none!important}

#xd-sub.xd-on .icon{stroke:#22c55e!important}
#xd-upd:disabled{opacity:.6;cursor:default}
#xd-upd,#xd-sub{margin-left:0!important}
</style>
<script id="xd-enhance-js">
(function(){
  if (window.__xdEnh) return; window.__xdEnh = 1;
  var SUBS = null, READY = false;

  function tip(msg, ms){
    var t = document.getElementById('xd-tip');
    if(!t) return;
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t.__tm);
    t.__tm = setTimeout(function(){ t.style.display='none'; }, ms || 3200);
  }

  // 从卡片里取番号：aria-label="在 javdb 打开 ALDN-628 的详情页"
  function codeOf(card){
    var a = card.querySelector('a.detail[aria-label]');
    if (a){
      var m = /打开\s+(.+?)\s+的详情页/.exec(a.getAttribute('aria-label') || '');
      if (m) return m[1].toUpperCase();
    }
    var t = (card.textContent || '');
    var m2 = /([A-Z][A-Z0-9]{1,8}-\d{2,6})/.exec(t);
    return m2 ? m2[1].toUpperCase() : '';
  }

  function paint(){
    if (!SUBS) return;
    var cards = document.querySelectorAll('.card.clickable:not([data-xd-scan])');
    for (var i=0;i<cards.length;i++){
      var c = cards[i]; c.setAttribute('data-xd-scan','1');
      var code = codeOf(c);
      if (!code) continue;
      if (SUBS[code]){
        c.setAttribute('data-xd-sub','1');
        if (getComputedStyle(c).position === 'static') c.style.position = 'relative';
        var b = document.createElement('span');
        b.className = 'xd-badge'; b.textContent = '中字';
        c.appendChild(b);
      }
    }
  }

  var ICON_UPD = '<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>';
  var ICON_SUB = '<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 14h4M13 14h4"></path></svg>';

  function buildToolbar(){
    if (document.getElementById('xd-upd')) return;
    var rand = document.querySelector('.header button.random') ||
               document.querySelector('.header .sort');
    if (!rand) return;

    function cloneAttrs(el, target){
      target.className = rand.className;
      for (var i = 0; i < rand.attributes.length; i++) {
        var at = rand.attributes[i];
        if (at.name.indexOf('data-v-') === 0) target.setAttribute(at.name, at.value);
      }
    }

    var upd = document.createElement('button');
    upd.id = 'xd-upd'; upd.type = 'button';
    upd.title = '立即抓取最新作品'; upd.setAttribute('aria-label', '立即抓取最新作品');
    upd.innerHTML = ICON_UPD + '<span>更新</span>';

    var sub = document.createElement('button');
    sub.id = 'xd-sub'; sub.type = 'button';
    sub.title = '只看有中文字幕的作品'; sub.setAttribute('aria-label', '只看有中文字幕的作品');
    sub.innerHTML = ICON_SUB + '<span>中文</span>';

    cloneAttrs(rand, upd); cloneAttrs(rand, sub);
    upd.style.setProperty('margin-left', '0', 'important');
    sub.style.setProperty('margin-left', '0', 'important');
    // 插到「随机」之后，保持间距和其他按钮一致
    var anchor = rand.nextSibling;
    rand.parentElement.insertBefore(upd, anchor);
    rand.parentElement.insertBefore(sub, upd.nextSibling);

    var t = document.createElement('div'); t.id = 'xd-tip';
    if (!document.getElementById('xd-tip')) document.body.appendChild(t);

    var only = localStorage.getItem('xd_only_sub') === '1';
    if (only){ document.body.classList.add('xd-only-sub'); sub.classList.add('xd-on'); }

    sub.onclick = function(){
      var on = document.body.classList.toggle('xd-only-sub');
      sub.classList.toggle('xd-on', on);
      localStorage.setItem('xd_only_sub', on ? '1' : '0');
      tip(on ? '只看中文字幕（共 ' + (SUBS ? Object.keys(SUBS).length : '?') + ' 部）' : '已显示全部作品');
    };

    upd.onclick = function(){
      upd.disabled = true;
      upd.querySelector('span').textContent = '更新中';
      fetch('/api/sync', {method:'POST'}).then(function(r){ return r.json(); }).then(function(j){
        if (j && j.ok){
          tip('已触发更新，约 1~3 分钟后完成，页面会自动刷新', 6000);
          var t0 = Date.now();
          var timer = setInterval(function(){
            if (Date.now() - t0 > 240000){
              clearInterval(timer); upd.disabled=false;
              upd.querySelector('span').textContent='更新'; return;
            }
            fetch('/api/status?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(s){
              if (s && s.data && s.data.updated_at){
                if (new Date(s.data.updated_at).getTime() > t0){ clearInterval(timer); location.reload(); }
              }
            }).catch(function(){});
          }, 8000);
        } else {
          tip('更新失败：' + ((j && j.error) || '未知错误'), 6000);
          upd.disabled = false; upd.querySelector('span').textContent = '更新';
        }
      }).catch(function(e){
        tip('请求失败：' + e, 5000);
        upd.disabled = false; upd.querySelector('span').textContent = '更新';
      });
    };
  }

  function boot(){
    buildToolbar();
    fetch('data/subtitles.json').then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if (!j) return;
      SUBS = {}; (j.codes || []).forEach(function(c){ SUBS[c] = 1; });
      READY = true;
      paint();
      var mo = new MutationObserver(function(){ buildToolbar(); paint(); if (typeof fixImgs === 'function') fixImgs(); });
      mo.observe(document.body, {childList:true, subtree:true});
      if (typeof fixImgs === 'function') fixImgs();
    }).catch(function(){});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script src="xd_plus.js?v=1" defer></script>
<script>
/* LTX 数据即时同步：data/movies.json 一变，这个页面自己刷新 */
(function () {
  'use strict';
  if (!document.querySelector('meta[name="ltx-app"]')) return;
  var KEY = 'ltx.dataVersion';
  var stored = null;
  try { stored = sessionStorage.getItem(KEY); } catch (e) {}
  var primed = false, checking = false, fired = false;
  function sig(r) {
    return [r.headers.get('etag') || '', r.headers.get('last-modified') || '', r.headers.get('content-length') || ''].join('|');
  }
  function bar(text, onclick) {
    var el = document.createElement('div');
    el.textContent = text;
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:2147483000;max-width:88vw;padding:10px 16px;border-radius:10px;background:#101418ee;color:#fff;font:14px/1.5 system-ui,sans-serif;box-shadow:0 8px 28px #0007';
    if (onclick) { el.style.cursor = 'pointer'; el.addEventListener('click', onclick); }
    document.body.appendChild(el);
    return el;
  }
  function reloadUi() {
    var busy = document.querySelector('dialog[open]');
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !!document.querySelector('[contenteditable="true"]:focus');
    if (busy || typing) { bar('资源库有更新 · 点这里刷新', function () { location.reload(); }); return; }
    var el = bar('资源库有更新，3 秒后自动刷新…');
    var left = 3;
    var timer = setInterval(function () {
      left -= 1;
      if (left <= 0) { clearInterval(timer); location.reload(); return; }
      el.textContent = '资源库有更新，' + left + ' 秒后自动刷新…';
    }, 1000);
  }
  async function check() {
    if (checking || fired) return;
    checking = true;
    try {
      var r = await fetch('data/movies.json?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      if (r && r.ok) {
        var s = sig(r);
        if (!primed) {
          primed = true; stored = s;
          try { sessionStorage.setItem(KEY, s); } catch (e) {}
        } else if (s && s !== stored) {
          fired = true;
          try { sessionStorage.setItem(KEY, s); } catch (e) {}
          reloadUi();
        }
      }
    } catch (e) {}
    checking = false;
  }
  setInterval(check, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setTimeout(check, 4000);
})();
</script>
